<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#181818">
  <title>cloudflare-tmux</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css?v=13">
</head>
<body>
  <!-- Icons used more than once, drawn in the style of VS Code's codicons. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cloud" viewBox="0 0 16 16"><path fill="currentColor" d="M4.5 13a3.5 3.5 0 0 1-.6-6.95A4.5 4.5 0 0 1 12.6 6.2 3 3 0 0 1 12 12.9l-.5.1h-7zM8 2.5A3.5 3.5 0 0 0 4.6 7.1l-.1.4h-.4a2.5 2.5 0 0 0 .4 5h7a2 2 0 0 0 .4-3.96l-.5-.1.1-.5A3.5 3.5 0 0 0 8 2.5z"/></symbol>
      <symbol id="i-sessions" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v1.5H2zM2 7.25h12v1.5H2zM2 11.5h12V13H2z"/></symbol>
      <symbol id="i-files" viewBox="0 0 16 16"><path fill="currentColor" d="M13.5 1h-8l-.5.5V4H2.5l-.5.5v10l.5.5h8l.5-.5V12h2.5l.5-.5v-9zM10 14H3V5h4v3h3zm3-3h-2V7.5L8.5 5H6V2h7z"/></symbol>
      <symbol id="i-account" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.2a5.8 5.8 0 0 1 4.6 9.3 6.5 6.5 0 0 0-9.2 0A5.8 5.8 0 0 1 8 2.2zm0 10.6a5.8 5.8 0 0 1-3.7-1.3 5.3 5.3 0 0 1 7.4 0A5.8 5.8 0 0 1 8 12.8zM8 4a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></symbol>
      <symbol id="i-new-folder" viewBox="0 0 16 16"><path fill="currentColor" d="M14.5 2H7.7l-.9-.9L6.5 1h-5l-.5.5v11l.5.5H7v-1H2V3h4.3l.9.9.3.1h6.5v3h1v-4.5zM11 9h1v2h2v1h-2v2h-1v-2H9v-1h2z"/></symbol>
      <symbol id="i-upload" viewBox="0 0 16 16"><path fill="currentColor" d="M8.5 2.8l3.6 3.6-.7.7L8.5 4.2V11h-1V4.2L4.6 7.1l-.7-.7L7.5 2.8zM3 12h10v1H3z"/></symbol>
      <symbol id="i-paste" viewBox="0 0 16 16"><path fill="currentColor" d="M10 2h-.6A2 2 0 0 0 7.5 1h-1a2 2 0 0 0-1.9 1H4l-1 1v10l1 1h8l1-1V3zm-4-.1a1 1 0 0 1 1.2 0 .5.5 0 0 0 .3.1h.5a1 1 0 0 1 1 1H5a1 1 0 0 1 1-1zM12 13H4V3h.6a2 2 0 0 0 .4.5V4h4v-.5a2 2 0 0 0 .4-.5h.6z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16"><path fill="currentColor" d="M13.5 2.5l-.5.5v2.3A6 6 0 0 0 2 8h1a5 5 0 0 1 9.3-2.5H10v1h3.5l.5-.5V3zM2.5 13.5l.5-.5v-2.3A6 6 0 0 0 14 8h-1a5 5 0 0 1-9.3 2.5H6v-1H2.5l-.5.5V13z"/></symbol>
      <symbol id="i-more" viewBox="0 0 16 16"><path fill="currentColor" d="M4 8a1.2 1.2 0 1 1-2.4 0A1.2 1.2 0 0 1 4 8zm5.2 0a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0zm5.2 0a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></symbol>
      <symbol id="i-close" viewBox="0 0 16 16"><path fill="currentColor" d="M8 8.7l-4 4-.7-.7 4-4-4-4 .7-.7 4 4 4-4 .7.7-4 4 4 4-.7.7z"/></symbol>
      <symbol id="i-up" viewBox="0 0 16 16"><path fill="currentColor" d="M8 3l4.5 4.5-.7.7L8.5 4.9V13h-1V4.9L4.2 8.2l-.7-.7z"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 16 16"><path fill="currentColor" d="M6 4l4 4-4 4-.7-.7L8.6 8 5.3 4.7z"/></symbol>
      <symbol id="i-chev-down" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4-.7-.7L8 8.6 4.7 5.3z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 16 16"><path fill="currentColor" d="M14.5 3H7.7l-.9-.9L6.5 2h-5l-.5.5v11l.5.5h13l.5-.5v-10zM14 13H2V3h4.3l.9.9.3.1H14z"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 14h11l.5-.4 2-7-.5-.6H14V4.5l-.5-.5H7.7l-.9-.9L6.5 3h-5l-.5.5v10zM2 4h4.3l.9.9.3.1H13v1H3.5l-.5.4L2 10zm.7 9l1.6-6h9.5l-1.7 6z"/></symbol>
      <symbol id="i-file" viewBox="0 0 16 16"><path fill="currentColor" d="M13.9 4.6l-3.5-3.5L10 1H4.5l-.5.5v13l.5.5h9l.5-.5V5zM13 14H5V2h4v3h4zm0-10h-3V2z"/></symbol>
      <symbol id="i-image" viewBox="0 0 16 16"><path fill="currentColor" d="M2.5 2h11l.5.5v11l-.5.5h-11l-.5-.5v-11zM3 3v7.3l2.6-2.6h.8l2.1 2.1 2.5-2.5h.8l1.2 1.2V3zm10 7.7l-1.6-1.6-2.5 2.5h-.8L6 9.5 3 12.5v.5h10zM10 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 16 16"><path fill="currentColor" d="M2.5 2h11l.5.5v11l-.5.5h-11l-.5-.5v-11zM3 3v10h10V3zm1.9 2.2l2.9 2.8-2.9 2.8-.7-.7L6.3 8 4.2 5.9zM8 10h4v1H8z"/></symbol>
      <symbol id="i-symlink" viewBox="0 0 16 16"><path fill="currentColor" d="M7 2H2.5l-.5.5v11l.5.5h11l.5-.5V8h-1v5H3V3h4zm2-1h5.5l.5.5V7h-1V3.2L8.4 8.8l-.7-.7L13.3 2H9z"/></symbol>
    </defs>
  </svg>

  <section id="dashboard" hidden>
    <header class="titlebar">
      <span class="mark"><svg width="16" height="16"><use href="#i-cloud"/></svg>cloudflare-tmux</span>
      <span class="title"></span>
      <span id="me" class="me"></span>
      <a id="logout-btn" class="btn" href="/cdn-cgi/access/logout">Log out</a>
    </header>
    <main class="wrap">
      <h2>Sessions</h2>
      <form id="new-form" class="row">
        <input id="new-name" placeholder="New session name" autocomplete="off"
               pattern="[A-Za-z0-9_\-]{1,32}" maxlength="32" required>
        <button type="submit" class="primary">New session</button>
      </form>
      <p id="error" class="error" hidden></p>
      <p class="section">Open</p>
      <ul id="sessions" class="sessions"></ul>
      <p id="empty" class="muted" hidden>No sessions yet. Create one above.</p>
    </main>
  </section>

  <section id="twofa" hidden>
    <header class="titlebar">
      <span class="mark"><svg width="16" height="16"><use href="#i-cloud"/></svg>cloudflare-tmux</span>
      <span class="title"></span>
      <span id="twofa-me" class="me"></span>
      <a class="btn" href="/cdn-cgi/access/logout">Log out</a>
    </header>
    <main class="wrap narrow">
      <h2>Two-step verification</h2>
      <form id="twofa-form" class="row">
        <input id="twofa-code" placeholder="6-digit code from your authenticator app" inputmode="numeric"
               autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
        <button type="submit" class="primary">Verify</button>
      </form>
      <p id="twofa-error" class="error" hidden></p>
    </main>
  </section>

  <section id="terminal-view" hidden>
    <header class="topbar">
      <a href="#/" class="tb-btn" title="All sessions (this one keeps running)"><svg width="16" height="16"><use href="#i-sessions"/></svg><span class="tb-label">Sessions</span></a>
      <span class="crumb-sep">/</span>
      <b id="term-name" class="term-name"></b>
      <span id="status" class="status" role="status"></span>
      <span class="spacer"></span>
      <button id="files-btn" class="tb-btn" title="Files" aria-pressed="false"><svg width="16" height="16"><use href="#i-files"/></svg><span class="tb-label">Files</span></button>
      <a id="term-logout" class="tb-btn" href="/cdn-cgi/access/logout" title="Log out"><svg width="16" height="16"><use href="#i-account"/></svg></a>
    </header>
    <div class="workbench" id="workbench">
      <aside id="files" class="sidebar" hidden>
        <div class="side-head">
          <span class="side-title">Files</span>
          <button id="files-mkdir" class="icon" title="New folder"><svg width="16" height="16"><use href="#i-new-folder"/></svg></button>
          <button id="files-upload" class="icon" title="Upload files"><svg width="16" height="16"><use href="#i-upload"/></svg></button>
          <button id="files-paste" class="icon" title="Upload the image on the clipboard"><svg width="16" height="16"><use href="#i-paste"/></svg></button>
          <button id="files-refresh" class="icon" title="Refresh"><svg width="16" height="16"><use href="#i-refresh"/></svg></button>
          <button id="files-more" class="icon" title="More"><svg width="16" height="16"><use href="#i-more"/></svg></button>
          <button id="files-close" class="icon side-close" title="Close"><svg width="16" height="16"><use href="#i-close"/></svg></button>
        </div>
        <div class="side-root">
          <button id="files-up" class="icon" title="Parent folder"><svg width="16" height="16"><use href="#i-up"/></svg></button>
          <span id="files-path" class="files-path"></span>
        </div>
        <p id="files-error" class="error files-msg" hidden></p>
        <ul id="files-list" class="tree" tabindex="0" aria-label="Files"></ul>
      </aside>
      <div id="sash" class="sash" role="separator" aria-orientation="vertical" aria-label="Resize the file panel"
           title="Drag to resize. Double-click to reset." tabindex="0" hidden></div>
      <div class="editor">
        <div id="terminal"></div>
        <div id="drop" class="drop" hidden><div><svg width="32" height="32"><use href="#i-upload"/></svg><span>Drop to upload to <code id="drop-dir"></code> and type the path</span></div></div>
      </div>
    </div>
    <nav id="keys" class="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-mod="ctrl" id="ctrl-btn">Ctrl</button>
      <button data-key="prefix" title="tmux prefix (Ctrl-b)">^B</button>
      <button data-key="up">&uarr;</button>
      <button data-key="down">&darr;</button>
      <button data-key="left">&larr;</button>
      <button data-key="right">&rarr;</button>
      <button data-key="|">|</button>
      <button data-key="~">~</button>
    </nav>
    <input type="file" id="files-input" multiple hidden>
  </section>
  <div id="toasts" class="toasts"></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/vendor/addon-clipboard/lib/addon-clipboard.js"></script>
  <script src="/app.js?v=15"></script>
</body>
</html>
