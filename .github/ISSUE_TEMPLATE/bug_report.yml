name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Install mode
      options: [single-user, multi-user]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS / Node.js / tmux / cloudflared versions
      placeholder: Ubuntu 24.04, Node 22.11, tmux 3.4, cloudflared 2025.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`journalctl --user -u cloudflare-tmux -n 50`. Remove emails and tokens."
      render: text
